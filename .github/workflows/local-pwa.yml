name: GYM local PWA

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'catalogue/**'
      - 'scripts/catalogue/stage-media.mjs'
      - 'docs/LOCAL_PWA.md'
      - '.github/workflows/local-pwa.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact revision validated by upstream sync (leave empty for a manual release)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gym-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'IF911/GYM' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require the revision validated by upstream sync
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo 'main moved after validation; refusing to publish a different revision'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Check dependency security and tooling compatibility
        run: npm run check:security
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Check the on-device Apple Health shortcut
        run: python3 scripts/build-health-shortcut.test.py
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      - run: npm run test:fatigue-probe
        working-directory: frontend
      - run: npm run build:local
        working-directory: frontend
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
